<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ColinHouse 的主页</title>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    body {
      font-family: "Verdana", "Arial", "sans-serif";
      background-color: #c0c0c0;
      color: #000000;
      margin: 0;
      padding: 20px;
    }

    .container {
      width: 90%;
      max-width: 800px;
      margin: 20px auto;
      padding: 30px;
      border: 2px solid #000000;
      background-color: #ffffff;
      box-shadow: 5px 5px 0px #808080;
    }

    h1 {
      font-size: 28px;
      color: #000080;
      border-bottom: 2px solid #000000;
      padding-bottom: 10px;
    }

    /* 【添加】让H1标题可点击返回首页 */
    h1 a {
      color: #000080;
      text-decoration: none;
      cursor: pointer;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
    }

    .welcome-marquee {
      font-size: 18px;
      font-weight: bold;
      color: #ff0000;
      background-color: #ffff00;
      padding: 5px;
      text-align: center;
      border: 1px solid #000;
      overflow: hidden;
      white-space: nowrap;
    }

    .welcome-marquee span {
      display: inline-block;
      padding-left: 100%;
      animation: marquee 15s linear infinite;
    }

    @keyframes marquee {
      0% {
        transform: translate(0, 0);
      }

      100% {
        transform: translate(-200%, 0);
      }
    }

    .links {
      margin-top: 30px;
    }

    .links a {
      color: #0000ff;
      text-decoration: underline;
      cursor: pointer;
      /* 【添加】让它看起来像个按钮 */
    }

    .footer {
      margin-top: 40px;
      font-size: 12px;
      text-align: center;
      color: #333333;
    }

    /* 2. 【添加】为MD内容添加的样式 */
    #content-display {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px dashed #808080;
    }

    /* 为 marked.js 转换后的 HTML 添加一点点样式 */
    #content-display h1 {
      font-size: 24px;
      color: #333;
    }

    #content-display h2 {
      font-size: 20px;
      color: #444;
    }

    #content-display pre {
      background-color: #f0f0f0;
      padding: 10px;
      border: 1px solid #ccc;
      overflow-x: auto;
    }

    #content-display code {
      font-family: "Courier New", Courier, monospace;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="welcome-marquee">
      <span>
        !!! 欢迎来到 ColinHouse 的个人主页 ~ Welcome to my Homepage !!!
      </span>
    </div>

    <h1><a onclick="showHomepage(); return false;">👋 你好, 世界!</a></h1>

    <div id="homepage-content">
      <p>
        这里是 ColinHouse。
      </p>
      <p>
        这个网站是纯手写的HTML，用来代替那个部署了一万年还在报错的 VuePress 博客。
        有时候，最简单的反而是最好的。
      </p>

      <div class="links">
        <p><strong>我的链接 (点击加载):</strong></p>
        <ul>
          <li><a onclick="loadMarkdown('./first_post.md'); return false;">我的第一篇文章 (first_post.md)</a></li>

        </ul>
      </div>
    </div>
    <div id="content-display">
    </div>


    <div class="footer">
      <p>最后更新于：一个阳光明媚的下午，当我受够了 EJSONPARSE 错误时。</p>
      <p>&copy; 2025 ColinHouse</p>
    </div>

  </div>

  <script>
    // 获取元素
    const homepageContent = document.getElementById('homepage-content');
    const contentDisplay = document.getElementById('content-display');

    /**
     * 函数：加载并显示 Markdown 文件
     * 这就是您 onclick 调用的函数！
     */
    async function loadMarkdown(mdFileUrl) {
      try {
        // 1. 隐藏主页内容
        homepageContent.style.display = 'none';

        // 2. 显示加载中...
        contentDisplay.innerHTML = '<p>加载中...</p>';

        // 3. 异步获取 .md 文件
        const response = await fetch(mdFileUrl);
        if (!response.ok) {
          // 如果 fetch 失败 (例如 404), 抛出错误
          throw new Error('找不到文件: ' + mdFileUrl + ' (请检查路径是否正确)');
        }
        const markdownText = await response.text();

        // 4. 使用 marked.js 将 MD 转换为 HTML
        // 检查 marked 是否被正确加载
        if (typeof marked === 'undefined') {
          throw new Error('marked.js 库没有被正确加载。');
        }
        const htmlContent = marked.parse(markdownText);

        // 5. 将 HTML 显示在页面上
        contentDisplay.innerHTML = htmlContent;

      } catch (error) {
        // 如果任何一步出错，都在这里显示错误信息
        console.error(error);
        contentDisplay.innerHTML = `<p style="color: red; font-weight: bold;">加载失败：${error.message}</p>`;
      }
    }

    /**
     * 函数：显示主页 (当点击标题时)
     */
    function showHomepage() {
      homepageContent.style.display = 'block'; // 显示主页
      contentDisplay.innerHTML = ''; // 清空MD内容
    }
  </script>

</body>

</html>
